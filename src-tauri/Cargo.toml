[package]
name = "kagami"
version = "1.0.0"
edition = "2021"
default-run = "kagami"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kagami-core = { path = "../crates/kagami-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }
